name: Shell checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  shell-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: |
          bash -n install-kvm-cachyos.sh
          bash -n tests/test-os-detection.sh

      - name: Test fail-closed OS detection
        run: bash tests/test-os-detection.sh
